# dsh-autostart-workbuddy 的挂载声明。
#
# DSH 启动时按 bundle 层栈把各插件的 patch 叠起来组成配置树，本文件就是本插件这一层：
#   - insert：往配置树里添加新的插件行（entry）
#   - id：行标识，必须全局唯一（patch 覆盖与插件管理页都按它定位）
#   - name：插件模块名＝npm 包名（@zhiqiangme/dsh-autostart-workbuddy），解析到 package.json 的 main（lib/index.js）
#     行 id 刻意保留改作用域包之前的 dsh-autostart-workbuddy：用户 cordis.patch.yml 里的配置按 id 覆盖，id 不变设置就不用迁移
#
# 注意：`id:` 那一行后面不要写行尾注释——DSH 商城预检用正则抓该行的值，
# 行尾注释会让它抓不到 entry ID。
- insert:
    - id: dsh-autostart-workbuddy
      name: '@zhiqiangme/dsh-autostart-workbuddy'
